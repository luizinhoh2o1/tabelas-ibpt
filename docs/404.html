<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas IBPT</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/public/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon-180x180.png">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap"></noscript>
  <style>
    /* Design System VALRAW UI - light corporate (mesma paleta de index.html) */
    :root {
      --fundo-principal: #FFFFFF;
      --fundo-section: #F7F9FC;
      --primaria: #000793;
      --primaria-escura: #00055E;
      --verde-escuro: #037A00;
      --secundaria: #1F2937;
      --secundaria-escura: #111827;
      --borda-sutil: #EDF2F7;
      --texto-principal: #1F2937;
      --texto-secundario: #4A5568;
      --texto-terciario: #718096;
      --texto-inverso: #FFFFFF;
      --erro: #E53E3E;
      --sombra-card: 0 4px 24px rgba(15,23,42,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Ubuntu Mono', 'SFMono-Regular', Consolas, monospace;
      background: var(--fundo-principal);
      color: var(--texto-principal);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { color: var(--secundaria); background: rgba(5,199,0,0.22); }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--fundo-section); }
    ::-webkit-scrollbar-thumb { background: #CBD5E0; border-radius: 6px; border: 2px solid var(--fundo-section); }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .header a { color: var(--primaria); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .header a:hover { color: var(--primaria-escura); text-decoration: underline; }
    .method { background: var(--verde-escuro); color: var(--texto-inverso); padding: 3px 10px; border-radius: 6px; font-weight: 700; font-size: 12px; }
    .path { color: var(--primaria-escura); font-size: 14px; word-break: break-all; }
    .status { font-size: 13px; color: var(--texto-terciario); }
    .error { color: var(--erro); }
    pre {
      background: var(--secundaria-escura);
      border: 1px solid var(--secundaria);
      border-radius: 16px;
      padding: 20px;
      color: #E2E8F0;
      overflow: auto;
      max-height: calc(100vh - 120px);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--sombra-card);
    }
    .not-found {
      text-align: center;
      padding: 80px 20px;
      color: var(--texto-terciario);
      font-family: 'Ubuntu', system-ui, sans-serif;
    }
    .not-found h1 {
      font-size: 64px; line-height: 1; margin-bottom: 12px; font-weight: 700;
      background: linear-gradient(135deg, #000793 0%, #05C700 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .not-found p { font-size: 16px; margin-bottom: 24px; color: var(--texto-secundario); }
    .not-found a { color: var(--primaria); text-decoration: none; font-weight: 500; }
    .not-found a:hover { color: var(--primaria-escura); text-decoration: underline; }
    .not-found code {
      display: inline-block; margin-top: 6px;
      background: var(--fundo-section); border: 1px solid var(--borda-sutil);
      padding: 3px 10px; border-radius: 6px;
      font-family: 'Ubuntu Mono', monospace; font-size: 13px; color: var(--primaria-escura);
    }
  </style>
</head>
<body>
  <div id="conteudo"></div>
  <script>
    const caminho = location.pathname.replace(/\/$/, '');
    const base = location.origin;

    // Verificar se o path corresponde a um endpoint de dados da API
    const padraoApi = caminho.match(/\/api\/(\d{4})\/([^/]+)\/([^/]+)\/([A-Z]{2})$/);

    if (padraoApi) {
      // Rota de dados: /api/{ano}/{tabela}/{tipo}/{uf}
      const urlGz = `${base}${caminho}.json.gz`;
      exibirDados(urlGz, caminho);
    } else if (caminho.match(/\/api(\/|$)/) && !caminho.endsWith('.json') && !caminho.endsWith('.gz')) {
      // Tentar como index.json
      const urlJson = `${base}${caminho}${caminho.endsWith('/') ? '' : '/'}index.json`;
      exibirJson(urlJson, caminho);
    } else {
      exibir404();
    }

    async function exibirDados(url, rota) {
      const el = document.getElementById('conteudo');
      el.innerHTML = `
        <div class="header">
          <span class="method">GET</span>
          <span class="path">${rota}</span>
          <span class="status">Carregando...</span>
          <a href="/">Voltar para consulta</a>
        </div>
        <pre id="json">Descomprimindo...</pre>
      `;

      try {
        const resposta = await fetch(url);
        if (!resposta.ok) { exibir404(); return; }

        const fluxo = resposta.body.pipeThrough(new DecompressionStream('gzip'));
        const texto = await new Response(fluxo).text();
        const dados = JSON.parse(texto);

        document.querySelector('.status').textContent =
          `${resposta.status} OK | ${dados.dados ? dados.dados.length.toLocaleString('pt-BR') + ' registros' : ''}`;
        document.getElementById('json').textContent = JSON.stringify(dados, null, 2);
      } catch (e) {
        document.querySelector('.status').className = 'status error';
        document.querySelector('.status').textContent = 'Erro ao descomprimir';
        document.getElementById('json').textContent = e.message;
      }
    }

    async function exibirJson(url, rota) {
      const el = document.getElementById('conteudo');
      el.innerHTML = `
        <div class="header">
          <span class="method">GET</span>
          <span class="path">${rota}</span>
          <span class="status">Carregando...</span>
          <a href="/">Voltar para consulta</a>
        </div>
        <pre id="json">Carregando...</pre>
      `;

      try {
        const resposta = await fetch(url);
        if (!resposta.ok) { exibir404(); return; }

        const dados = await resposta.json();
        document.querySelector('.status').textContent = `${resposta.status} OK`;
        document.getElementById('json').textContent = JSON.stringify(dados, null, 2);
      } catch (e) {
        exibir404();
      }
    }

    function exibir404() {
      document.getElementById('conteudo').innerHTML = `
        <div class="not-found">
          <h1>404</h1>
          <p>Página não encontrada</p>
          <p><a href="/">Ir para a página de consulta</a></p>
          <p style="font-size:13px; margin-top:24px;">
            Endpoints disponíveis:<br>
            <code>/api/meta.json</code><br>
            <code>/api/{ano}/{tabela}/{tipo}/{uf}</code>
          </p>
        </div>
      `;
    }
  </script>
</body>
</html>
